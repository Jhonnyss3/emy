{% extends "base.html" %}

{% block title %}{{ title }} · Emy{% endblock %}

{% block content %}
<div class="mb-5">
    {% include "finances/_back_button.html" %}
</div>
<form method="post"
      class="grid overflow-hidden rounded-[2.5rem] bg-emy-surface shadow-[0_30px_80px_-30px_rgba(42,26,54,0.45)] md:grid-cols-2">
    {% csrf_token %}

    <div class="bg-gradient-to-br from-emy-pink-100 via-emy-pink-50 to-emy-purple-100 p-8 sm:p-10">
        <h1 class="text-3xl font-extrabold tracking-tight">{{ title }}</h1>
        <p class="mt-1 text-sm text-emy-ink-soft">Um espaço para o que a casa planeja.</p>
    </div>

    <div class="p-8 sm:p-10">
        <label for="id_name" class="mb-1 block text-sm font-semibold text-emy-ink-soft">Nome da lista</label>
        <input type="text" name="name" id="id_name" value="{{ form.name.value|default:'' }}" placeholder="Ex.: Compras" required
               class="w-full rounded-2xl bg-emy-bg px-4 py-3 text-sm text-emy-ink outline-none ring-1 ring-emy-line transition focus:bg-emy-surface focus:ring-2 focus:ring-emy-pink-400">
        {% for error in form.name.errors %}<p class="mt-1 text-xs text-emy-bad">{{ error }}</p>{% endfor %}
        <button type="submit"
                class="mt-8 flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-br from-emy-pink-500 to-emy-purple-500 px-4 py-3.5 text-sm font-bold text-white shadow-btn transition hover:opacity-95">
            Criar lista <span aria-hidden="true">→</span>
        </button>
    </div>
</form>
{% endblock %}
