{% extends "base.html" %}

{% block title %}{{ title }} · Emy{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
    <div class="mb-6 flex items-center gap-3">
        {% include "finances/_back_button.html" %}
        <h1 class="text-3xl font-extrabold tracking-tight">{{ title }}</h1>
    </div>

    <form method="post" class="rounded-[1.75rem] bg-emy-surface p-6 shadow-sm">
        {% csrf_token %}
        <div>
            <label for="id_name" class="mb-1 block text-sm font-semibold text-emy-ink-soft">Nome do grupo</label>
            <input type="text" name="name" id="id_name" value="{{ form.name.value|default:'' }}" placeholder="Ex.: Casa" autofocus required
                   class="w-full rounded-2xl bg-emy-bg px-4 py-3 text-sm text-emy-ink outline-none ring-1 ring-emy-line transition focus:bg-emy-surface focus:ring-2 focus:ring-emy-pink-400">
            {% for error in form.name.errors %}<p class="mt-1 text-xs text-emy-bad">{{ error }}</p>{% endfor %}
        </div>
        <button type="submit"
                class="mt-6 flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-br from-emy-pink-500 to-emy-purple-500 px-4 py-3.5 text-sm font-bold text-white shadow-btn transition hover:opacity-95">
            {{ submit_label|default:"Criar grupo" }} <span aria-hidden="true">→</span>
        </button>
    </form>
</div>
{% endblock %}
