services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port published on purpose: the database is only reachable from the
    # web service over the internal compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
